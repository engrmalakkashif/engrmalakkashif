<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kashif Khan - Cloud Infrastructure and DevOps Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a22"/>
      <stop offset="0.5" stop-color="#16303d"/>
      <stop offset="1" stop-color="#1f4a63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="0.5" stop-color="#3FB6FF"/>
      <stop offset="1" stop-color="#FF9900"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0078D4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0078D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#EE0000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#EE0000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>
  <circle cx="1080" cy="70" r="90" fill="none" stroke="#3FB6FF" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="1080" cy="70" r="55" fill="none" stroke="#3FB6FF" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="110" cy="240" r="70" fill="none" stroke="#FF9900" stroke-opacity="0.15" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="15" fill="#3FB6FF" letter-spacing="6" font-weight="600">HELLO, I'M</text>
  <text x="600" y="132" text-anchor="middle" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="2">Kashif Khan</text>
  <text x="600" y="178" text-anchor="middle" font-size="26" fill="#7fd1ff" font-weight="500">Cloud Infrastructure &amp; DevOps Engineer</text>
  <text x="600" y="228" text-anchor="middle" font-size="21" fill="#d6ecf7" opacity="1" letter-spacing="1">AWS  •  Microsoft Azure  •  Hybrid Cloud
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.230;0.250;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="228" text-anchor="middle" font-size="21" fill="#d6ecf7" opacity="0" letter-spacing="1">Terraform  •  Ansible  •  Infrastructure as Code
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.270;0.480;0.500;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="228" text-anchor="middle" font-size="21" fill="#d6ecf7" opacity="0" letter-spacing="1">Azure DevOps  •  Jenkins  •  GitHub Actions
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.520;0.730;0.750;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="228" text-anchor="middle" font-size="21" fill="#d6ecf7" opacity="0" letter-spacing="1">Docker  •  Kubernetes  •  Red Hat Linux  •  DevSecOps
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.770;1" dur="16s" repeatCount="indefinite"/>
